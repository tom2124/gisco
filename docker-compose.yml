services:
  gisco:
    build: .
    image: gisco:latest
    container_name: gisco
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/stacks:/stacks
      - ./templates:/templates
    environment:
      - GISCO_PORT=8080
      - GISCO_STACK_DIR=/stacks
      - GISCO_TEMPLATE_DIR=/templates
      - GISCO_DEFAULT_UID=1000
      - GISCO_DEFAULT_GID=1000
